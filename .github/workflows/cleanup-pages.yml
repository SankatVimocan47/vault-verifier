name: Clean up successful portfolio runs

on:
  workflow_run:
    workflows: ["Deploy portfolio to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-portfolio-runs
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Published Pages content survives run deletion. This is not a privacy control:
      # commits, deployment records, and this active cleanup run remain visible.
      - uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['pages.yml', 'cleanup-pages.yml']) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  ...context.repo,
                  workflow_id,
                  branch: 'main',
                  status: 'success',
                  per_page: 100,
                },
              );
              for (const run of runs) {
                if (run.id === context.runId) continue;
                await github.rest.actions.deleteWorkflowRun({
                  ...context.repo,
                  run_id: run.id,
                });
                core.info(`Deleted completed run ${run.id}`);
              }
            }
